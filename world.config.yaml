# name: the game's name — fill it once you know what this is. description: one line for the box art.
camera: templates/camera.js#camera
lighting: scripts/lighting.js
defaultPlace: main
engine:
  behaviors:
    - scripts/arrival.js
  networking:
    mode: multiplayer
  ui:
    theme:
      font: Georgia, 'Times New Roman', serif
inputs:
  actions:
    interact:
      keys: [e]
    jump:
      keys:
        - space
    descend: {keys: [shift]}
    camView: {keys: ['7']}
    deleteMode: {keys: ['8']}
    deleteThing: {keys: ['9']}
    courierLumen: {keys: ['1']}
    courierHearth: {keys: ['2']}
    courierCancel: {keys: ['3']}
    travelMenu: {keys: [j]}
    horse: {keys: [z]}
    travelClose: {keys: [escape]}
    travelGo: {}
    brew: {}
    travelHome: {keys: ['1']}
    travelLumen: {keys: ['2']}
    travelHearth: {keys: ['3']}
    travelTower: {keys: ['4']}
    travelDock: {keys: ['5']}
    travelGate: {keys: ['6']}
    fish: {keys: ['2']}
  axes:
    moveX:
      keys: a/d
    moveZ:
      keys: s/w
  touch:
    surfaces: {default: {buttons: [{action: interact, label: USE, size: primary, slot: 1}, {action: jump, label: JUMP, slot: 2}, {action: descend, label: DOWN, slot: 3}, {action: travelMenu, label: TRAVEL, slot: 4}], look: true, orientation: any, pinch: false, sticks: [{x: moveX, y: moveZ, zone: left}]}}
player: templates/player.js#player
name: The First Den
description: A warm little home above a lake, with room for whatever you make next.
ui:
  render: scripts/ui.js
