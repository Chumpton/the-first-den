  duration: 0.9
  tracks:
    legL: { pitch: [26, 0, -26, 0, 26] }
    legR: { pitch: [-26, 0, 26, 0, -26] }
    armL: { pitch: [-22, 0, 22, 0, -22] }
    armR: { pitch: [22, 0, -22, 0, 22] }
    root: { y: [0, 0.03, 0, 0.03, 0], roll: [2, 0, -2, 0, 2] }
    head: { pitch: [2, 0, 2, 0, 2] }
sit:
