# The hilltop villagers' clips (scripts/gen/villager.js bones). Pitch + tips the −Z front up.
idle:
  duration: 3.2
  tracks:
    spine: { pitch: [0, 1.5, 0], roll: [0, 1, 0, -1, 0] }
    head: { yaw: [0, 8, 8, -6, 0], pitch: [0, -3, 0] }
    armL: { roll: [-4, -6, -4] }
    armR: { roll: [4, 6, 4] }
