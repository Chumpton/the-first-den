  tracks:
    legL: { pitch: [18, -18, 18] }
    legR: { pitch: [-18, 18, -18] }
    armL: { pitch: [-10, 10, -10], roll: [0, 2, 0] }
    armR: { pitch: [10, -10, 10], roll: [0, -2, 0] }
