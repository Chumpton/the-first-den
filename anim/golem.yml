  tracks:
    head: { yaw: [0, 34, 38, 36, 0], pitch: [0, 5, 6, 5, 0] }
    spine: { yaw: [0, 10, 12, 10, 0] }
    armL: { pitch: [0, 3, 3, 3, 0] }
bow:
