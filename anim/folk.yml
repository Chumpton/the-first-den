# Folk clips (scripts/gen/folk.js rig). Degrees about each bone's local axes: +pitch swings a limb forward (-Z),
# -pitch on a lowerLeg bends the knee, +roll swings the right arm out (-roll the left). "Hold" variants keep the
# right arm still so a staff, broom, rod, crook or halberd stays upright; their wave uses the left hand.
idle:
  duration: 3.2
  tracks:
    chest: { pitch: [0, 2.5, 0] }
    head: { pitch: [0, -2, 0], yaw: [0, 4, 0, -4, 0] }
    upperArmL: { roll: [-4, -7, -4] }
    upperArmR: { roll: [4, 7, 4] }
    lowerArmL: { pitch: [8, 13, 8] }
    lowerArmR: { pitch: [8, 13, 8] }
idleHold:
  duration: 3.2
  tracks:
    chest: { pitch: [0, 2.5, 0] }
    head: { pitch: [0, -2, 0], yaw: [0, 4, 0, -4, 0] }
    upperArmL: { roll: [-4, -7, -4] }
    lowerArmL: { pitch: [8, 13, 8] }
walk:
  duration: 0.9
  tracks:
    hips: { roll: [2, 0, -2, 0, 2] }
    spine: { yaw: [4, 0, -4, 0, 4] }
    chest: { pitch: [3, 3, 3, 3, 3] }
    head: { pitch: [0, -2, 0, -2, 0] }
    upperLegL: { pitch: [22, 0, -22, 0, 22] }
    upperLegR: { pitch: [-22, 0, 22, 0, -22] }
    lowerLegL: { pitch: [-6, -10, -15, -45, -6] }
    lowerLegR: { pitch: [-15, -45, -6, -10, -15] }
    footL: { pitch: [-8, 0, 10, 12, -8] }
    footR: { pitch: [10, 12, -8, 0, 10] }
    upperArmL: { pitch: [-18, 0, 18, 0, -18] }
    upperArmR: { pitch: [18, 0, -18, 0, 18] }
    lowerArmL: { pitch: [15, 20, 25, 20, 15] }
    lowerArmR: { pitch: [25, 20, 15, 20, 25] }
walkHold:
  duration: 0.9
  tracks:
    hips: { roll: [2, 0, -2, 0, 2] }
    spine: { yaw: [4, 0, -4, 0, 4] }
    chest: { pitch: [3, 3, 3, 3, 3] }
    head: { pitch: [0, -2, 0, -2, 0] }
    upperLegL: { pitch: [22, 0, -22, 0, 22] }
    upperLegR: { pitch: [-22, 0, 22, 0, -22] }
    lowerLegL: { pitch: [-6, -10, -15, -45, -6] }
    lowerLegR: { pitch: [-15, -45, -6, -10, -15] }
    footL: { pitch: [-8, 0, 10, 12, -8] }
    footR: { pitch: [10, 12, -8, 0, 10] }
    upperArmL: { pitch: [-18, 0, 18, 0, -18] }
    lowerArmL: { pitch: [15, 20, 25, 20, 15] }
    upperArmR: { pitch: [3, 1, 3, 1, 3] }
talk:
  duration: 2.4
  tracks:
    chest: { pitch: [2, 4, 2, 4, 2] }
    head: { pitch: [0, -6, 2, -5, 0], yaw: [0, 6, -4, 3, 0] }
    upperArmR: { pitch: [10, 35, 20, 40, 10], roll: [8, 15, 10, 18, 8] }
    lowerArmR: { pitch: [30, 70, 45, 75, 30] }
    upperArmL: { pitch: [5, 20, 8, 22, 5], roll: [-6, -12, -6, -12, -6] }
    lowerArmL: { pitch: [20, 45, 30, 50, 20] }
talkHold:
  duration: 2.4
  tracks:
    chest: { pitch: [2, 4, 2, 4, 2] }
    head: { pitch: [0, -6, 2, -5, 0], yaw: [0, 6, -4, 3, 0] }
    upperArmL: { pitch: [10, 35, 20, 40, 10], roll: [-8, -15, -10, -18, -8] }
    lowerArmL: { pitch: [30, 70, 45, 75, 30] }
wave:
  duration: 1.2
  tracks:
    head: { roll: [0, 4, 0, 4, 0] }
    upperArmR: { roll: [150, 150, 150, 150, 150], pitch: [10, 10, 10, 10, 10] }
    lowerArmR: { roll: [0, 35, 0, 35, 0] }
    upperArmL: { roll: [-4, -6, -4, -6, -4] }
waveHold:
  duration: 1.2
  tracks:
    head: { roll: [0, -4, 0, -4, 0] }
    upperArmL: { roll: [-150, -150, -150, -150, -150], pitch: [10, 10, 10, 10, 10] }
    lowerArmL: { roll: [0, -35, 0, -35, 0] }
