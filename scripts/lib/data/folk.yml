# The districts' folk: 20 authored characters (scripts/gen/folk.js params.who), one manager (scripts/folk-crowd.js).
# Clips live in anim/folk.yml. A new person is one roster row; a new district is one districts row.
clips: anim/folk.yml
visibleRange: 110            # m: bodies and name tags
nameSize: 0.22
nameLift: 0.28               # m over the model's own height
reach: 3.5                   # E: nearest folk to the presser within this answers
pressSecs: 4
waveSecs: 1.6                # a wave before the talk gesture when pressed
wakeRadius: 120              # a district with no player this near stands still
turnRate: 6
speed: [0.9, 1.25]           # m/s walking
restSecs: [3, 9]             # idle between errands
stuckSecs: 3                 # moved < stuckDist in this long: pick another goal
stuckDist: 0.35
talkChance: 0.35             # a rest spent gesturing instead of idling
spawnLift: 0.05
hold: [witch, apprentice, fisher, shepherdess, watch]   # right hand keeps its pole upright
districts:
  market: { box: [-19, 19, 81, 119], avoid: market }
  magic: { at: [82, 78], r: 16 }
  garden: { at: [0, 128], r: 12 }
  royal: { at: [0, 196], r: 14 }
avoid:
  market:                    # from town-crowd.yml: fountain disc + the three market islands (+margin)
    circle: [0, 100, 7.2]
    rects: [[-16.2, 100.3, 8.4, 13.4], [15.8, 99.6, 8.4, 17.4], [-14.2, 85.5, 10.4, 11.4]]
