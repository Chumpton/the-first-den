  - { id: folk-smith, who: smith, model: np-smith, name: Brom the Smith, district: market, at: [-6, 112] }
  - { id: folk-baker, who: baker, model: np-baker, name: Dora the Baker, district: market, at: [6, 90] }
  - { id: folk-merchant, who: merchant, model: np-merchant, name: Master Pell, district: market, at: [8, 116] }
  - { id: folk-kid, who: kid, model: np-kid, name: Scamp, district: market, at: [-4, 84] }
  - { id: folk-ranger, who: ranger, model: np-ranger, name: Wren, district: market, at: [3, 110] }
  - { id: folk-bard, who: bard, model: np-bard, name: Lark the Bard, district: fountain, at: [-5.5, 102], y: 0.45, faceAway: [0, 100] }
  - { id: folk-fisher, who: fisher, model: np-fisher, name: Old Gill, district: dock, at: [4.3, -60], y: 0.92, faceWater: true }
  - { id: folk-witch, who: witch, model: np-witch, name: Granny Nettle, district: magic, at: [78, 72] }
  - { id: folk-apprentice, who: apprentice, model: np-apprentice, name: Tobin, district: magic, at: [86, 82] }
  - { id: folk-alchemist, who: alchemist, model: np-alchemist, name: Vesper, district: magic, at: [88, 72] }
  - { id: folk-tinkerer, who: tinkerer, model: np-tinkerer, name: Cogsworth, district: magic, at: [76, 84] }
  - { id: folk-beekeeper, who: beekeeper, model: np-beekeeper, name: Hester, district: garden, at: [-8, 124] }
  - { id: folk-flowergirl, who: flowergirl, model: np-flowergirl, name: Posy, district: garden, at: [8, 124] }
  - { id: folk-gardener, who: gardener, model: np-gardener, name: Old Rook, district: garden, at: [-10, 152] }
  - { id: folk-shepherdess, who: shepherdess, model: np-shepherdess, name: Elsie, district: garden, at: [10, 152] }
  - { id: folk-herald, who: herald, model: np-herald, name: Herald Quill, district: royal, at: [0, 188] }
