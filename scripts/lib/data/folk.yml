lines:
  smith: ["Mind the sparks, friend.", "A good hinge outlives the door.", "Bring me iron and I'll bring you a blade."]
  herald: ["Hear ye! The crown bids you welcome!", "Proclamation: the fair runs all week.", "The King's road is open to all."]
  baker: ["Fresh loaves, still warm!", "Up since three, kneading.", "Try the honey bun. You'll be back."]
  witch: ["Heh heh, lost, dearie?", "Newt eyes are dear this season.", "My broom's older than your grandmother."]
  apprentice: ["I almost cast a fireball today!", "Master says the staff chooses you.", "Is it glowing? It's supposed to glow."]
  knight: ["The realm is safe while I stand.", "Keep to the road after dark.", "Honour first, lunch second."]
  merchant: ["Everything has a price, dear friend.", "Silk from the south, finest you'll find.", "Coin's heavy today. Business is good."]
  beekeeper: ["Slow movements, the bees are sleepy.", "Clover honey this month.", "They only sting the rude ones."]
  flowergirl: ["A daisy for you? Only a copper!", "I picked these at dawn.", "Roses for the lady in your life?"]
  fisher: ["Shh. They're biting.", "Caught one THIS big last spring.", "The lake gives when she wants to."]
  bard: ["A song for a coin!", "I'm composing a ballad about you.", "Three chords and the truth."]
  gardener: ["Talk to your tomatoes. They listen.", "Rain's coming Thursday. I feel it in my knees.", "Weeds are just flowers nobody loves."]
  ranger: ["Wolves by the north woods. Stay sharp.", "Tracks lead east of the lake.", "The forest remembers."]
  cleric: ["Blessings of the dawn upon you.", "The bells ring at noon.", "Peace be on your travels."]
  kid: ["Bet you can't catch me!", "I found a shiny button!", "Is it true you've got a dragon?"]
  lady: ["Such a charming little town.", "Do mind my hem, darling.", "The ball is on Saturday. You'll come?"]
  alchemist: ["Don't touch that. Really.", "Almost gold. Almost.", "Smells like progress!"]
  tinkerer: ["Hand me that sprocket?", "It clicks, it whirs, it mostly works.", "Built a clockwork mouse once. It ran off."]
  shepherdess: ["Have you seen a lost lamb?", "My flock grazes by the west pasture.", "Wool's soft this year."]
  watch: ["All's well. So far.", "Lantern's lit, eyes are open.", "Move along, citizen. Kindly."]
