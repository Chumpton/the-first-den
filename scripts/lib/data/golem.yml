# Mossback the stone golem: every tuned number scripts/stone-golem.js reads.
speed: 0.7            # m/s
turnRate: 40          # deg/s
pause: [4, 9]         # seconds at each waypoint
greetRange: 6         # m: a player this close is greeted once per approach
greetMs: 4000
bowMs: 2600
wakeRange: 150        # m: no player this near = asleep
stepMs: 1200          # half the 2.4 s walk cycle
lookAhead: 2.5        # m probed ahead while walking
leg: [7, 24]          # waypoint distance range, m
sampleStep: 1         # m between segment samples
minGround: 0.2        # never step where the ground sits lower (water)
glow: 1.2             # eye brightness
glowBright: 3.6       # while bowing
lawn: { x0: -38, x1: 38, z0: -46, z1: 3 }
creekBuffer: 4
creek: [[-12, 0], [-20, -6], [-26, -14], [-28, -30], [-28, -48]]
keepOuts:
  circles:
    - { name: house, x: 0, z: -26, r: 15 }
    - { name: workshop, x: 17, z: -41, r: 12 }
    - { name: studio, x: -19, z: -36, r: 11 }
    - { name: glasshouse, x: 14, z: -56, r: 9 }
    - { name: camp, x: -19, z: -50, r: 10 }
    - { name: treehouse-a, x: -27, z: -18, r: 12 }
    - { name: treehouse-b, x: -18, z: -29, r: 13 }
    - { name: catio, x: -11, z: -20, r: 11 }
    - { name: coop, x: 27, z: -28, r: 9 }
    - { name: hives, x: 31, z: -46, r: 8 }
    - { name: gazebo, x: -8, z: -42, r: 9 }
    - { name: gate, x: 0, z: 5, r: 6 }
    - { name: arch-treehouse, x: -19, z: -16, r: 6 }
    - { name: bed-front, x: 6, z: -11, r: 5 }
  rects:
    - { name: avenue, x0: -6, x1: 6, z0: -18, z1: 7 }
    - { name: gate-walls, x0: -15, x1: 15, z0: 0, z1: 9 }
    - { name: garden-east, x0: 9, x1: 22, z0: -38, z1: -12 }
    - { name: garden-south, x0: -10, x1: 12, z0: -53, z1: -33 }
    - { name: garden-west, x0: -22, x1: -1, z0: -18, z1: -5 }
sounds:
  step: /cdn/moodboard-lowpoly-cozy/sfx-stone-golem-heavy-footstep-thud.mp3
  rumble: /cdn/moodboard-lowpoly-cozy/sfx-stone-golem-friendly-rumble.mp3
  stepVolume: 0.5
  maxDistance: 30
words: Mossback watches over the den
