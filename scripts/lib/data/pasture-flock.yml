# West pasture flock (rows tagged pasture-flock, moved by scripts/pasture-flock.js on the west-pasture fence row)
inset: 0.9          # metres kept off the fence
spacing: 1.3        # metres between two animals' goals
step: [2.2, 5.5]    # a walk's length
species:
  sheep:
    speed: 0.42
    graze: [7, 16]
    stand: [3, 7]
    walkChance: 0.3
    call: { clip: /cdn/moodboard-lowpoly-cozy/sfx-sheep-baa-soft.mp3, chance: 0.14, volume: 0.55, pitch: [0.88, 1.2], maxDistance: 32 }
  alpaca:
    speed: 0.5
    graze: [6, 13]
    stand: [4, 9]
    walkChance: 0.34
    call: { clip: /cdn/moodboard-lowpoly-cozy/sfx-alpaca-hum-soft.mp3, chance: 0.07, volume: 0.45, pitch: [0.9, 1.08], maxDistance: 28 }
clips:
  sheep:
    walk:
      duration: 0.8
      tracks:
        legFL: { pitch: [22, 0, -22, 0, 22] }
        legBR: { pitch: [22, 0, -22, 0, 22] }
        legFR: { pitch: [-22, 0, 22, 0, -22] }
        legBL: { pitch: [-22, 0, 22, 0, -22] }
        neck: { pitch: [-6, -9, -6, -9, -6] }
        root: { y: [0, 0.02, 0, 0.02, 0] }
        tail: { yaw: [8, -8, 8, -8, 8] }
    graze:
      duration: 1.7
      tracks:
        neck: { pitch: [-52, -56, -50, -55, -52] }
        head: { pitch: [-26, -20, -27, -21, -26], roll: [0, 3, 0, -3, 0] }
        tail: { yaw: [0, 0, 14, -14, 0] }
    stand:
      duration: 4.2
      tracks:
        neck: { pitch: [0, 4, 4, 2, 0] }
        head: { yaw: [0, 18, 18, -14, 0], pitch: [0, -4, -4, 0, 0] }
        tail: { yaw: [0, 10, -10, 0, 0] }
  alpaca:
    walk:
      duration: 1.05
      tracks:
        legFL: { pitch: [18, 0, -18, 0, 18] }
        legBL: { pitch: [18, 0, -18, 0, 18] }
        legFR: { pitch: [-18, 0, 18, 0, -18] }
        legBR: { pitch: [-18, 0, 18, 0, -18] }
        neck: { pitch: [3, -2, 3, -2, 3] }
        head: { pitch: [-3, 2, -3, 2, -3] }
        root: { y: [0, 0.025, 0, 0.025, 0], roll: [1.5, 0, -1.5, 0, 1.5] }
    graze:
      duration: 2
      tracks:
        neck: { pitch: [-112, -116, -110, -115, -112] }
        head: { pitch: [-38, -32, -39, -33, -38] }
    stand:
      duration: 5
      tracks:
        neck: { pitch: [0, 3, 3, 0, 0], yaw: [0, 6, 6, -5, 0] }
        head: { yaw: [0, 22, 22, -18, 0], pitch: [0, 6, 6, 0, 0] }
        tail: { pitch: [0, 8, 0, 8, 0] }
