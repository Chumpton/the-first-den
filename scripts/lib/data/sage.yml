# Sage, the low-flying garden dragon: every tuned number for scripts/sage-dragon.js + scripts/lib/sage-route.js
# (seconds, metres, degrees). Route measured clear of every collider at 1.2 m body radius (overlapSegment sweep, 1 m steps).
every: [150, 300]        # seconds between flights
first: 40                # first flight this long after the manager spawns
laps: [1, 2]             # laps of the circuit per flight
speed: 9                 # m/s along the circuit
scale: 0.6               # jade geometry is ~12.6 m long -> ~7.5 m
step: 2                  # manager update every N ticks while flying
seaLevel: 0              # the lake surface; altitude is measured above max(ground, sea)
alt: [4, 7]              # clamp: metres above ground while on the circuit
bob: { amp: 0.5, len: 37 }   # altitude swell (m) per metres of travel
bank: 0.9                # roll per unit lateral accel, clamped
maxBank: 32
# enter/leave: the first and last `blend` metres slide in from / out to the forest edge, `out` m outward and `rise` m up
enter: { blend: 45, out: 40, rise: 22 }
# closed circuit, [x, altitude above ground, z], world; starts at the east edge (outward = forest) so she enters and leaves there.
# east past the workshop, south round the hives and glasshouse over the lake edge, back past the dock end, round the gazebo
# and studio, between the two treehouse trunks under their rope bridge, past the catio, over the front walk, past the rain catch and coop.
route:
  - [27, 5.5, -38]
  - [26, 5.5, -51]
  - [21, 5, -65]
  - [12, 5, -68]
  - [3, 5, -67]
  - [-3, 5, -56]
  - [-3, 5, -48]
  - [-12, 5, -48.5]
  - [-27, 5, -44]
  - [-27, 4.5, -34]
  - [-22, 4.0, -23]
  - [-18, 5, -12.5]
  - [-9, 5.5, -9]
  - [-1, 6, -6.5]
  - [6, 6, -8]
  - [16, 5.5, -14]
  - [20, 5.5, -24]
  - [21, 5.5, -31]
# look: jade geometry re-hued (hue/chroma scale/light lift), then single parts set outright
palette:
  hue: 145
  chroma: 1.3
  light: -0.12
  colors:
    BELLY: [0.92, 0.07, 118]
    BELLY2: [0.88, 0.08, 108]
    MANE: [0.76, 0.15, 108]
    WHISKER: [0.9, 0.12, 100]
spark: [0.9, 2.4, 0.9]   # hdr trail colour
wave: { period: 1.6, amp: 11, grow: 0.75, phase: 0.62, lift: 2.5, neck: 5, head: -5 }
tag: { text: Sage, at: { x: 0, y: 2.6, z: -1.2 }, size: 0.6, color: "oklch(0.96 0.07 140)" }
sound:
  chime: /cdn/moodboard-lowpoly-cozy/sfx-dragon-soft-whoosh-chime.mp3
  gain: 0.75
  range: 30              # maxDistance of the chime
  near: 14               # a player this close hears one chime per pass
  cooldown: 15           # seconds before the same player hears another
  loop: /cdn/moodboard-lowpoly-cozy/sfx-sky-dragon-distant-wind-whoosh-loop.mp3
  loopGain: 0.16
  loopRange: 40
# greet: a grounded player within `notice` m (horizontal) of her path point makes her break off, glide down in `glide` s and
# hover `gap` m in front of them, `lift` m up, facing them, for `hold` s; each E press holds her `stay` s more; she leaves when
# the time runs out or they walk `leave` m off, then resumes the circuit where she paused. E alternates pat / treat, `cooldown` s apart.
greet:
  notice: 9
  leave: 14
  hold: 8
  stay: 8
  glide: 1.4
  max: 2
  again: 60
  gap: 3.2
  lift: 1.9
  reach: 1.5             # the invisible press point sits this far from the player toward her (interaction reach is 3 m)
  cooldown: 5
  prompt: "Sage  ·  [E] pat / treat"
  chirp: /cdn/moodboard-lowpoly-cozy/sfx-small-dragon-happy-chirp-trill.mp3
  chomp: /cdn/moodboard-lowpoly-cozy/sfx-dragon-snaps-apple-crunch.mp3
  sneeze: /cdn/moodboard-lowpoly-cozy/sfx-tiny-dragon-flame-sneeze-puff.mp3
