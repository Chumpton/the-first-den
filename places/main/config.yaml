atmosphere:
  sky:
    kind: realistic
    turbidity: 2
  timeOfDay: 12
  cycle:
    frozen: 12
  clouds:
    enabled: true
    density: 0.15
    opacity: 0.6
    speed: 0.5
  fog:
    kind: linear
    near: 400
    far: 2400
  look:
    script: scripts/look-den.js
    params: {bloomRadius: 0.6, bloomStrength: 0.15, bloomThreshold: 1, exposure: 0.92}
  wind:
    direction: 225
    speed: 1
defaultSpawnPoint:
  x: 0
  y: 0.05
  z: 0
gravity:
  x: 0
  y: -24
  z: 0
mode: 3d
terrain:
  kind: heightmap
  generator: scripts/flat-terrain.js
  seed: 1
  materials:
    - {id: white, albedo: cdn/texture-terrain-soft-white-matte-concrete.png, tint: oklch(0.97 0.004 90), textureScale: 6, pbr: true, normalStrength: 0.12, roughnessIntensity: 0.9, antiTiling: stochastic}
  verticalRange:
    min: -5
    max: 5
worldBounds:
  bottom: -60
